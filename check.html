<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Daily meds check</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#fff;color:#111;font-size:15px}
h1{font-size:20px;margin:0 0 12px}
table{border-collapse:collapse;width:100%}
td{border:1px solid #111;padding:8px;vertical-align:top}
td:first-child{width:45%}
.ok{color:#1b7a3a;font-weight:600}.bad{color:#b3261e;font-weight:600}
p{color:#555;font-size:13px}
</style></head><body>
<h1>Daily meds check</h1>
<table id="t"></table>
<p>Screenshot this page and send it over.</p>
<script>
const rows=[];
/* add() returns the row's number so a later result can replace it (set). */
function set(i,k,ok,v){rows[i]=`<tr><td>${k}</td><td>${ok===null?"":`<span class="${ok?"ok":"bad"}">${ok?"OK":"Problem"}</span>`} ${v||""}</td></tr>`;document.getElementById("t").innerHTML=rows.join("");return i}
function add(k,ok,v){return set(rows.length,k,ok,v)}
(async()=>{
  add("Browser",true,navigator.userAgent.replace(/^Mozilla\/5\.0 /,""));
  add("Secure page (https)",location.protocol==="https:",location.href);
  const swSupported="serviceWorker" in navigator; add("Offline support available",swSupported);
  /* Offline, the worker answers a missing file with the app page, so check the file came back as the right kind. */
  const TYPE={"index.html":"html","sw.js":"javascript","manifest.webmanifest":"json","icon-192.png":"image/png","icon-512.png":"image/png","icon-maskable-512.png":"image/png"};
  for(const f of Object.keys(TYPE)){
    try{const r=await fetch(f,{cache:"no-store"});const t=r.headers.get("content-type")||"";add(f,r.ok&&t.includes(TYPE[f]),"status "+r.status+" · "+t)}
    catch(e){add(f,false,String(e))}
  }
  try{const m=await (await fetch("manifest.webmanifest",{cache:"no-store"})).json();add("Manifest readable",true,`name "${m.name}", ${m.icons?.length||0} icons, display ${m.display}`)}
  catch(e){add("Manifest readable",false,String(e))}
  if(swSupported){
    /* If the worker can't install (say the app page didn't download), it never becomes ready, so stop waiting after 10 s.
       If it does finish later, both rows below are updated. */
    const offlineCopy=async()=>{const keys=(await caches.keys().catch(()=>[])).filter(k=>k.startsWith("daily-meds-"));
      for(const k of keys){const c=await caches.open(k);if(await c.match("index.html")&&await c.match("./"))return [true,keys]}return [false,keys]};
    const swRow=add("Offline worker running",null,"checking…"), copyRow=add("Offline copy saved",null,"checking…");
    const showCopy=async()=>{const [ok,keys]=await offlineCopy();set(copyRow,"Offline copy saved",ok,keys.join(", ")||"none")};
    const ready=navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready);
    let t;
    try{const r=await Promise.race([ready,new Promise((_,no)=>{t=setTimeout(()=>no(new Error("timed out waiting for the offline worker")),10000)})]);set(swRow,"Offline worker running",!!r.active,r.scope)}
    catch(e){set(swRow,"Offline worker running",false,String(e));ready.then(r=>{set(swRow,"Offline worker running",!!r.active,r.scope+" (ready after the timeout)");showCopy()},()=>{})}
    finally{clearTimeout(t)}
    await showCopy();
  }
  try{localStorage.setItem("daily-meds-check","1");localStorage.removeItem("daily-meds-check");add("Storage works",true)}catch(e){add("Storage works",false,String(e))}
  add("Opened as installed app",null,matchMedia("(display-mode: standalone)").matches?"yes":"no (opened in browser)");
  add("Phone dark mode",null,matchMedia("(prefers-color-scheme: dark)").matches?"on":"off");
})();
</script></body></html>
